<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Konfirmasi Email YukReview</title></head>
<body style="margin:0;padding:24px 12px;background:#f6f3ef;font-family:Arial,Helvetica,sans-serif;color:#29231f;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr><td align="center">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#ffffff;border-radius:20px;">
      <tr><td style="padding:32px 28px;">
        <p style="margin:0 0 24px;font-size:20px;font-weight:bold;color:#765338;">YukReview</p>
        <h1 style="margin:0 0 16px;font-size:24px;line-height:1.3;">Konfirmasi alamat email Anda</h1>
        <p style="margin:0 0 24px;font-size:16px;line-height:1.6;">Klik tombol di bawah untuk mengonfirmasi alamat email dan melanjutkan pendaftaran akun YukReview.</p>
        <table role="presentation" cellpadding="0" cellspacing="0"><tr><td style="background:#765338;border-radius:12px;"><a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:15px 22px;font-size:16px;font-weight:bold;color:#ffffff;text-decoration:none;">Konfirmasi Email</a></td></tr></table>
        <p style="margin:24px 0 0;font-size:14px;line-height:1.6;color:#70685f;">Jika Anda tidak melakukan pendaftaran ini, abaikan email ini.</p>
        <p style="margin:24px 0 0;font-size:12px;line-height:1.5;color:#8a8178;">Email otomatis dari YukReview. Mohon tidak membalas email ini.</p>
      </td></tr>
    </table>
  </td></tr></table>
</body>
</html>
