name: Bulk Create PR validation
on:
  pull_request:
    paths:
      - 'app/provider/cards/**'
      - 'supabase/migrations/0036_provider_bulk_create_safe.sql'
      - '.github/workflows/bulk-create-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      # Repository has no package-lock.json; use npm install without caching.
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
      # Non-secret placeholders for build-only prerender. No database access.
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-placeholder-not-a-real-key
