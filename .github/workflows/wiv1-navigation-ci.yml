name: YukReview WiV1 navigation safety
on:
  pull_request:
    branches: [main, fix/bulk-designer-match-front-back-20261106]
    paths:
      - "app/page.tsx"
      - "app/bisnis/wifi/**"
      - "app/dashboard/DashboardNav.tsx"
      - "lib/wiv1Portal.ts"
      - "docs/wiv1-business-integration.md"
      - "tests/wiv1-navigation.test.mjs"
      - ".github/workflows/wiv1-navigation-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      NEXT_PUBLIC_WIV1_PORTAL_URL: https://wifi.yukreview.id
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install isolated dependencies
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Navigation isolation regression
        run: node --test tests/wiv1-navigation.test.mjs
      - name: Public Preview URL smoke (non-destructive)
        run: |
          set -euo pipefail
          wiv1="https://wi-v1-git-fix-wiv1-v06-security-stability-mjh10.vercel.app"
          yukpreview="https://ulasantoko-review-v3-git-feature-wiv1-business-fro-9ce877-mjh10.vercel.app"
          echo "Checking WiV1 client/provider login endpoints and YukReview business page, no credentials."
          curl -fsSL --max-time 25 "$wiv1/client" -o /tmp/wiv1-client.html
          curl -fsSL --max-time 25 "$wiv1/provider" -o /tmp/wiv1-provider.html
          curl -fsSL --max-time 25 "$yukpreview/bisnis/wifi" -o /tmp/yukreview-wifi.html
          grep -qi "Bisnis\|Client\|Masuk" /tmp/wiv1-client.html
          grep -qi "Provider\|Masuk" /tmp/wiv1-provider.html
          grep -qi "WiFi\|NFC" /tmp/yukreview-wifi.html
          grep -Fq "wi-v1-git-fix-wiv1-v06-security-stability-mjh10.vercel.app" /tmp/yukreview-wifi.html
          echo "Public route responses verified (no login or QR hardware test)."
      - name: TypeScript validation
        run: npx tsc --noEmit
      - name: Next.js production build with CI placeholders
        run: npm run build
      # Pre-existing activation-editor.cjs test failure on the live code snapshot.
      # Capture its result without masking TS/build or changing V3 production code.
      - name: Existing YukReview V3 legacy suite (known baseline failure)
        continue-on-error: true
        run: npm run test:all
